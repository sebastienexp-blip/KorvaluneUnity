# Compile l'APK Android de Korvalune sur les serveurs de GitHub (aucun PC requis).
# Secrets à créer dans le dépôt : UNITY_LICENSE (contenu du .ulf), UNITY_EMAIL, UNITY_PASSWORD.
# Lancement : onglet Actions > "Build Android APK" > Run workflow .
name: Build Android APK

on:
  workflow_dispatch:   # compilation uniquement sur demande

concurrency:
  group: build-android-korvalune
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Libérer de l'espace disque (image Android volumineuse)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Charger la licence (secret ou fichier .licence du dépôt privé)
        env:
          SECRET_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$SECRET_LICENSE" ]; then LIC="$SECRET_LICENSE";
          elif [ -f .licence/Unity_lic.ulf ]; then LIC="$(cat .licence/Unity_lic.ulf)";
          else echo "::error::Aucune licence Unity trouvée"; exit 1; fi
          { echo "UNITY_LICENSE<<ULF_EOF"; echo "$LIC"; echo "ULF_EOF"; } >> "$GITHUB_ENV"

      - name: Compiler avec Unity (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: Korvalune
          buildMethod: Korvalune.EditorTools.KorvaluneSetup.CIBuild
          androidExportType: androidPackage
          customParameters: -logFile /github/workspace/unity-build.log

      - name: "Erreurs Unity (si échec)"
        if: failure()
        run: |
          ls -la unity-build.log 2>&1 | head -2
          if [ -f unity-build.log ]; then
            echo "::notice::Journal : $(wc -l < unity-build.log) lignes"
            grep -n -E "error CS[0-9]+|Exception|Error building|Build failed|BuildFailedException|error:|Fatal|FailFast|Failed to|Shader error|ERROR" unity-build.log | grep -v -E "Licens|Curl error|TooManyRequests" | head -25 | cut -c1-380 | while IFS= read -r l; do echo "::error::${l}"; done
          fi

      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Korvalune-APK
          path: build/Android
          if-no-files-found: error
