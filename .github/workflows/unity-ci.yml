# Intégration Unity dans le cloud : ouvre le projet, importe et intègre les modèles ModelForge (FBX, textures, matériaux URP,
# avatars, clips, prefabs), construit la scène vitrine, vérifie chaque modèle, puis renvoie dans le dépôt les fichiers
# générés par Unity (.meta, matériaux, prefabs, contrôleurs, scène, réglages) et le rapport ci-report.md.
name: Unity — intégration des modèles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-ci.yml'

concurrency:
  group: unity-ci
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Libérer de l'espace disque
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v4

      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Forge-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Forge-

      - name: Charger la licence Unity
        env:
          SECRET_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$SECRET_LICENSE" ]; then LIC="$SECRET_LICENSE";
          elif [ -f .licence/Unity_lic.ulf ]; then LIC="$(cat .licence/Unity_lic.ulf)";
          else echo "::error::Aucune licence Unity trouvée"; exit 1; fi
          { echo "UNITY_LICENSE<<ULF_EOF"; echo "$LIC"; echo "ULF_EOF"; } >> "$GITHUB_ENV"

      - name: Effacer l'ancien rapport
        run: rm -f ci-report.md ci-out/progress.log

      - name: Unity — intégration des modèles modifiés (éditeur 1)
        id: process
        uses: game-ci/unity-builder@v4
        continue-on-error: true
        timeout-minutes: 80
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: Korvalune.EditorTools.CI.Run
          allowDirtyBuild: true
          customParameters: -ciPhaseProcess

      - name: Préparer la vérification
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . || true; rm -f ci-report.md

      - name: Unity — vérification des modèles et captures (éditeur 2)
        id: validate
        uses: game-ci/unity-builder@v4
        continue-on-error: true
        timeout-minutes: 80
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: Korvalune.EditorTools.CI.Run
          allowDirtyBuild: true
          customParameters: -ciPhaseValidate

      - name: Préparer les scènes
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . || true; rm -f ci-report.md

      - name: Unity — créateur, vallée et sélection (éditeur 3)
        id: unity
        uses: game-ci/unity-builder@v4
        continue-on-error: true
        timeout-minutes: 80
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: Korvalune.EditorTools.CI.Run
          allowDirtyBuild: true
          customParameters: -ciPhaseScenes

      - name: Rapport
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" . || true
          if [ ! -f ci-report.md ]; then
            { echo "# Rapport absent : Unity s'est arrêté avant la fin"; echo; echo '```';
              grep -E "error CS[0-9]+|Exception|Error|error" unity-editor.log 2>/dev/null | grep -v "^\s*$" | sort -u | head -60 || true;
              echo '```'; echo; echo "## Erreurs de compilation (Library/Bee, Logs)"; echo '```';
              grep -rhoaE "[A-Za-z0-9_/.-]+\.cs\([0-9]+,[0-9]+\): (error|warning) CS[0-9]+: [^\"\\]{0,300}" Library/Bee Logs Temp 2>/dev/null | grep "error CS" | sort -u | head -80 || true;
              echo '```'; echo; echo "## Dernières étapes (ci-out/progress.log)"; echo '```'; tail -40 ci-out/progress.log 2>/dev/null || echo "(aucune : la méthode CI n'a pas démarré)"; echo '```'; } > ci-report.md || true
          fi
          M=$(head -c 60000 ci-report.md | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          if [ "${{ steps.unity.outcome }}" = "success" ]; then echo "::notice title=Intégration Unity::${M}"; else echo "::error title=Intégration Unity::${M}"; fi
          mkdir -p ci-out
          tail -c 400000 unity-editor.log > ci-out/unity-editor-tail.log 2>/dev/null || true

      - name: Renvoyer les fichiers générés dans le dépôt
        if: always()
        run: |
          git config user.name "korvalune-ci"
          git config user.email "ci@korvalune.invalid"
          git add -A Assets ProjectSettings Packages ci-report.md ci-out 2>/dev/null || true
          if git diff --cached --quiet; then echo "rien à renvoyer"; exit 0; fi
          git commit -m "CI Unity : fichiers générés et rapport [skip ci]"
          for i in 1 2 3; do git pull --rebase -X ours origin main && git push origin HEAD:main && break; sleep 5; done

      - name: Sauver le cache Library
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-Forge-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}

      - name: Résultat
        if: always()
        run: |
          if [ "${{ steps.unity.outcome }}" = "success" ]; then exit 0; fi
          echo "::error::Échec de l'intégration Unity (voir ci-report.md)"; exit 1

  # Journal du job d'intégration récupéré par GitHub lui-même (l'archive des journaux n'est pas lisible depuis l'extérieur) :
  # les lignes utiles (erreurs, « Killed », fin du journal Unity) sont enregistrées dans ci-out/unity-job.log.
  journal:
    needs: integrate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Récupérer le journal du job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out
          JOB=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs --jq '.jobs[] | select(.name=="integrate") | .id')
          echo "job $JOB"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/jobs/$JOB/logs" -o job.log || true
          ls -la job.log; head -c 300 job.log
          {
            echo "# Journal du job d'intégration (run ${{ github.run_id }})"
            echo "## Lignes importantes"
            grep -nE "Killed|exit code|error CS|Caught fatal|Exception|Out of memory|OutOfMemory|\[ModelForge\]|Crash|abort" job.log | grep -v "ValidationExceptions" | head -150
            echo; echo "## Fin du journal Unity (400 dernières lignes avant l'arrêt)"
            L=$(grep -n "Build failed\|Exiting batchmode\|Application is shutting down" job.log | tail -1 | cut -d: -f1)
            [ -n "$L" ] && sed -n "$((L>400 ? L-400 : 1)),${L}p" job.log || tail -400 job.log
          } | cut -c1-400 > ci-out/unity-job.log
          wc -l ci-out/unity-job.log
          git config user.name "korvalune-ci"; git config user.email "ci@korvalune.invalid"
          git add ci-out/unity-job.log
          git commit -m "CI Unity : journal du job [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -X ours origin main && git push origin HEAD:main && break; sleep 5; done
