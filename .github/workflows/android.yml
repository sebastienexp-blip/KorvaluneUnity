# APK Android : construit après une intégration Unity réussie (ou à la demande), puis TESTÉ dans un émulateur Android
# (installation, lancement, captures d'écran, recherche de plantage). L'APK est publié dans la release « apk-derniere ».
name: Android — APK testé

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Unity — intégration des modèles"]
    types: [completed]

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Libérer de l'espace disque
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Mémoire d'échange (16 Go)
        run: |
          # la machine n'a que 8 Go : sans échange, Unity est tué pendant les gros imports / la construction Android
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/korvalune.swap && sudo chmod 600 /mnt/korvalune.swap && sudo mkswap /mnt/korvalune.swap && sudo swapon /mnt/korvalune.swap
          free -h

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-
            Library-Forge-

      - name: Charger la licence Unity
        env:
          SECRET_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$SECRET_LICENSE" ]; then LIC="$SECRET_LICENSE";
          elif [ -f .licence/Unity_lic.ulf ]; then LIC="$(cat .licence/Unity_lic.ulf)";
          else echo "::error::Secret UNITY_LICENSE absent : ajoute le contenu de ton fichier Unity_lic.ulf dans Settings → Secrets and variables → Actions"; exit 1; fi
          { echo "UNITY_LICENSE<<ULF_EOF"; echo "$LIC"; echo "ULF_EOF"; } >> "$GITHUB_ENV"

      - name: Unity — construction de l'APK
        id: unity
        uses: game-ci/unity-builder@v4
        continue-on-error: true
        timeout-minutes: 200
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: Korvalune.EditorTools.AndroidBuild.Build
          allowDirtyBuild: true

      - name: Rapport de construction
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" . || true
          mkdir -p ci-out/android
          if [ ! -f ci-out/android/build.md ]; then
            { echo "# Construction de l'APK : Unity s'est arrêté avant la fin"; echo '```';
              grep -rhoaE "[A-Za-z0-9_/.-]+\.cs\([0-9]+,[0-9]+\): error CS[0-9]+: [^\"\\]{0,300}" Library/Bee Logs Temp 2>/dev/null | sort -u | head -60 || true;
              echo '```'; } > ci-out/android/build.md || true
          fi
          ls -la build/Android 2>/dev/null || true
          cat ci-out/android/build.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: |
            build/Android/Korvalune.apk
            ci-out/android/build.md
          if-no-files-found: warn

      - name: Sauver le cache Library
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}

      - name: Résultat
        run: test -f build/Android/Korvalune.apk

  journal:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Journal de la construction Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out/android
          JOB=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs --jq '.jobs[] | select(.name=="build") | .id')
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/jobs/$JOB/logs" -o job.log || true
          {
            echo "# Journal de la construction Android (run ${{ github.run_id }})"
            echo "## Lignes importantes"
            grep -nE "Killed|exit code|error CS|Caught fatal|Exception|BuildFailedException|Build Finished|Result:|FAILURE|What went wrong|> Task.*FAILED|error:|Error building|Scènes|APK|❌" job.log | grep -v "ValidationExceptions" | head -200
            echo; echo "## Fin du journal (300 dernières lignes avant l'arrêt)"
            L=$(grep -n "Build failed\|Exiting batchmode\|Application is shutting down" job.log | tail -1 | cut -d: -f1)
            [ -n "$L" ] && sed -n "$((L>300 ? L-300 : 1)),${L}p" job.log || tail -300 job.log
          } | cut -c1-400 > ci-out/android/build-job.log
          git config user.name "korvalune-ci"; git config user.email "ci@korvalune.invalid"
          git add ci-out/android
          git commit -m "Android : journal de construction [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -X ours origin main && git push origin HEAD:main && break; sleep 5; done

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dl
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test dans l'émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/test-apk.sh dl/build/Android/Korvalune.apk
      - name: Publier les résultats
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat ci-out/android/test.md 2>/dev/null || true
          git config user.name "korvalune-ci"; git config user.email "ci@korvalune.invalid"
          cp dl/ci-out/android/build.md ci-out/android/build.md 2>/dev/null || true
          git add -A ci-out/android
          git commit -m "Android : APK construit et testé dans l'émulateur [skip ci]" || true
          for i in 1 2 3; do git pull --rebase -X ours origin main && git push origin HEAD:main && break; sleep 5; done
          if grep -q "RÉSULTAT : OK" ci-out/android/test.md 2>/dev/null; then
            V=$(grep -oE "version [0-9.]+" ci-out/android/build.md | head -1 | cut -d' ' -f2)
            gh release delete apk-derniere -y --cleanup-tag 2>/dev/null || true
            gh release create apk-derniere dl/build/Android/Korvalune.apk ci-out/android/*.png \
              --title "Korvalune ${V} — APK testé" --notes-file ci-out/android/test.md --latest
          fi
