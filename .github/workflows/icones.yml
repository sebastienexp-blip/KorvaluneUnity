# Importe les planches d'icônes de compétences générées (ElevenLabs, 4 colonnes × 2 lignes) et les découpe :
# chaque ligne de « liste » vaut « classe|premier indice|url ». Les 8 icônes deviennent
# Assets/Korvalune/Resources/Icons/Skills/<classe>_<indice>.png (256 px) ; un aperçu de la planche va dans ci-out/icones/.
name: Icônes — import

on:
  workflow_dispatch:
    inputs:
      liste:
        description: "Une ligne par planche : classe|premier indice|url"
        required: true

permissions:
  contents: write

concurrency:
  group: icones-import
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Outils
        run: pip install -q pillow numpy
      - name: Télécharger et découper
        env:
          LISTE: ${{ github.event.inputs.liste }}
        run: |
          mkdir -p Assets/Korvalune/Resources/Icons/Skills ci-out/icones /tmp/planches
          cat > /tmp/decoupe.py <<'PY'
          import sys, numpy as np
          from PIL import Image
          src, cls, first = sys.argv[1], sys.argv[2], int(sys.argv[3])
          im = Image.open(src).convert("RGB"); W, H = im.size
          a = np.asarray(im).astype(int).sum(axis=2)
          cols, rows = 4, 2; cw, ch = W / cols, H / rows
          for r in range(rows):
              for c in range(cols):
                  x0, y0, x1, y1 = int(c * cw), int(r * ch), int((c + 1) * cw), int((r + 1) * ch)
                  cell = a[y0:y1, x0:x1]
                  # contenu = pixels non noirs ; on cherche le cadre de l'icône (ignore les gouttières noires)
                  mask = cell > 60
                  ys = np.where(mask.mean(axis=1) > 0.25)[0]; xs = np.where(mask.mean(axis=0) > 0.25)[0]
                  if len(xs) < 10 or len(ys) < 10: bx0, by0, bx1, by1 = 0, 0, x1 - x0, y1 - y0
                  else: bx0, bx1, by0, by1 = xs[0], xs[-1] + 1, ys[0], ys[-1] + 1
                  s = max(bx1 - bx0, by1 - by0); cx, cy = (bx0 + bx1) / 2, (by0 + by1) / 2
                  box = (int(x0 + cx - s / 2), int(y0 + cy - s / 2), int(x0 + cx + s / 2), int(y0 + cy + s / 2))
                  ic = im.crop(box).resize((256, 256), Image.LANCZOS)
                  i = first + r * cols + c
                  ic.save(f"Assets/Korvalune/Resources/Icons/Skills/{cls}_{i}.png", optimize=True)
                  print(f"✅ {cls}_{i} ← cadre {box}")
          im.resize((W // 2, H // 2)).save(f"ci-out/icones/{cls}_{first}.jpg", quality=85)
          PY
          while IFS='|' read -r cls first url; do
            cls="$(echo "$cls" | tr -cd 'a-zA-Z')"; first="$(echo "$first" | tr -cd '0-9')"
            [ -z "$cls" ] || [ -z "$first" ] || [ -z "$url" ] && continue
            f="/tmp/planches/${cls}_${first}.png"
            if curl -sSfL --retry 3 -o "$f" "$url"; then python3 /tmp/decoupe.py "$f" "$cls" "$first"; else echo "❌ planche $cls $first"; fi
          done <<< "$LISTE"
          ls Assets/Korvalune/Resources/Icons/Skills | wc -l
      - name: Enregistrer
        run: |
          git config user.name "korvalune-ci"; git config user.email "ci@korvalune.invalid"
          git add Assets/Korvalune/Resources/Icons ci-out/icones
          git commit -m "Icônes de compétences : import [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
